<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>SCTracker Passwort zurücksetzen</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f2ea; color: #14251d; }
      main { width: min(440px, calc(100% - 40px)); padding: 32px; border: 1px solid #dde0d8; border-radius: 18px; background: #fffefa; box-shadow: 0 16px 40px rgb(20 37 29 / 10%); }
      h1 { margin: 0 0 12px; font-size: 1.6rem; }
      p { line-height: 1.55; color: #68766f; }
      a { display: block; margin-top: 22px; padding: 13px 18px; border-radius: 9px; background: #1f5a43; color: white; font-weight: 700; text-align: center; text-decoration: none; }
      .error { color: #a64536; }
    </style>
  </head>
  <body>
    <main>
      <h1>SCTracker Passwort zurücksetzen</h1>
      <p id="status">Die SCTracker-App wird geöffnet …</p>
      <a id="open-app" href="#" hidden>SCTracker öffnen</a>
    </main>
    <script>
      const token = new URLSearchParams(location.search).get("token");
      const status = document.querySelector("#status");
      const link = document.querySelector("#open-app");
      if (!token) {
        status.className = "error";
        status.textContent = "Der Reset-Link ist ungültig oder unvollständig.";
      } else {
        const appUrl = `sctracker://reset-password?token=${encodeURIComponent(token)}`;
        link.href = appUrl;
        link.hidden = false;
        location.replace(appUrl);
      }
    </script>
  </body>
</html>
